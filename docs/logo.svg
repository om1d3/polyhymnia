<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Polyhymnia logo: a golden lyre">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2f63"/>
      <stop offset="1" stop-color="#191b3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d58a"/>
      <stop offset="1" stop-color="#c9963b"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- arms of the lyre, curling outward at the top -->
    <path d="M104 196 C 72 168, 62 124, 80 90 C 90 70, 84 52, 66 48" stroke-width="10"/>
    <path d="M152 196 C 184 168, 194 124, 176 90 C 166 70, 172 52, 190 48" stroke-width="10"/>
    <!-- yoke -->
    <path d="M78 92 Q 128 80 178 92" stroke-width="9"/>
    <!-- strings -->
    <g stroke="#e6c06a" stroke-width="3" opacity="0.9">
      <path d="M108 89 V 192"/><path d="M118 87.5 V 192"/><path d="M128 87 V 192"/>
      <path d="M138 87.5 V 192"/><path d="M148 89 V 192"/>
    </g>
  </g>
  <!-- sound box -->
  <rect x="92" y="190" width="72" height="20" rx="10" fill="url(#gold)"/>
  <!-- a few notes drifting up -->
  <g fill="#f3d58a" opacity="0.85">
    <circle cx="200" cy="140" r="5"/><path d="M204.5 140 V 118" stroke="#f3d58a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="214" cy="112" r="3.5"/><path d="M217.5 112 V 96" stroke="#f3d58a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
