# The jfa wrapper uses this file. The folder where you start jfa becomes /work in the container.
# Thus, exports, edited files, backups and covers stay in your data folder, not in the program folder.
services:
  audit:
    build: .
    image: polyhymnia:local
    network_mode: host
    env_file: .env
    user: "${PUID:-0}:${PGID:-0}"
    volumes:
      - ${WORK:?start jfa in your data folder}:/work
